<div class="p-4">
    <h1>Les zones</h1>
    <div>
        @if(messageReservation) {
            <div [ngClass]="reservationReussie ? 'bg-green-100 text-green-800 border-green-400' : 'bg-red-100 text-red-800 border-red-400'"
             class="mt-3 p-3 rounded font-semibold border">
            {{ messageReservation }}
            </div>
        }
    </div>
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        @for (zone of zones; track zone.id){
            <div class="border rounded p-4 first-mt-3">
                <h2>{{zone.nom}} ({{zone.code}})</h2>
                <p>Capacité: {{zone.capacite}}</p>
                <button (click)="ouvrirFormulaireDate(zone)" class="bg-blue-600 text-white px-3 py-1 rounded mt-2">Réserver</button>
                    
                @if(zoneSelectionnee === zone) {
                    <label class="block mb-1">Début</label>
                    <input type="datetime-local" [(ngModel)]="dateDebut" (change)="verifierDisponibilite()" class="border p-2 w-full mb-2">
                    <label class="block mb-1">Fin</label>
                    <input type="datetime-local" [(ngModel)]="dateFin" (change)="verifierDisponibilite()" class="border p-2 w-full mb-2">
                
                @if(creneauDisponible !== null){
                    <p class="font-semibold my-2" [ngClass]="creneauDisponible ? 'text-green-600' : 'text-red-600'">
                        {{creneauDisponible ? 'Créneau disponible' : 'Créneau complet'}}
                    </p>
                }
            
                <button (click)="reserver()" class="font-semibold bg-green-600 px-3 rounded">Confirmer</button>
                }
                    
            </div>
        }
        
    </div>
</div>

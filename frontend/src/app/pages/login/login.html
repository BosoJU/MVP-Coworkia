<div class="max-w-sm mx-auto mt-10">
    <h1>Connexion</h1>

    @if(messageErreur){
        <p class="mt-3 p-3 rounded border-red-600 bg-red-100 text-red-800">{{messageErreur}}</p>
    }

    <form (ngSubmit)="onSubmit()">
        <label for="email" class="block mb-1">Email</label>
        <input type="email" name="email" [(ngModel)]="email" class="border p-2 w-full mb-3">

        <label for="password" class="block mb-1">Mot de passe</label>
        <input type="password" [(ngModel)]="password" name="password" class="border p-2 w-full mb-3">

        <button type="submit" class="btn-primary bg-[#7D188C] text-white hover:bg-[#651373]">Se connecter</button>
    </form>
</div>
